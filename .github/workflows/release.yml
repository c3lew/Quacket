# Cut a release: push a v* tag and this builds the NSIS installer, signs the
# updater artifacts, and publishes a GitHub release whose latest.json is what
# installed apps poll (see plugins.updater.endpoints in tauri.conf.json).
#
# Needs the TAURI_SIGNING_PRIVATE_KEY repo secret (the matching pubkey is baked
# into tauri.conf.json). The key has no password, hence the empty env below —
# unset would make the signer prompt and hang the runner.
name: Release

on:
  push:
    tags: ['v*']
  # Rerun a release by hand when a tag push event gets lost or a run is flaky.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'Quacket ${{ inputs.tag || github.ref_name }}'
          releaseBody: 'See the commit log for what changed.'
